version: '3'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  build:
    desc: Build Go binary
    cmds:
      - go build -o gocodenow ./cmd/gocodenow

  itest:
    desc: Run integration test suite
    cmds:
      - task: itest:check-server
      - task: itest:run-tests

  # Integration test subtasks
  itest:check-server:
    desc: Check if LLM server is reachable
    internal: true
    vars:
      ENDPOINT: '{{.ENDPOINT | default "http://192.168.86.20:1234"}}'
    cmds:
      - |
        echo "Checking LLM server at {{.ENDPOINT}}/v1..."
        if ! curl -s --connect-timeout 5 "{{.ENDPOINT}}/v1/models" > /dev/null; then
          echo "❌ LLM server is not reachable at {{.ENDPOINT}}/v1"
          echo "Please ensure your LLM server is running"
          exit 1
        fi
        echo "✅ LLM server is reachable"

  itest:run-tests:
    desc: Execute integration tests
    internal: true
    env:
      RUN_LLM_INTEGRATION_TESTS: true
      LLM_TEST_ENDPOINT: '{{.ENDPOINT | default "http://192.168.86.20:1234"}}'
      LLM_TEST_MODEL: '{{.MODEL | default "qwen2.5-coder-7b-instruct"}}'
      LLM_TEST_TOKEN: '{{.TOKEN}}'
    cmds:
      - go test -v ./internal/llm -run Integration

  itest:specific:
    desc: Run specific integration test
    internal: true
    vars:
      TEST: '{{.TEST | default "SimpleChatCompletion"}}'
    env:
      RUN_LLM_INTEGRATION_TESTS: true
      LLM_TEST_ENDPOINT: '{{.ENDPOINT | default "http://192.168.86.20:1234"}}'
      LLM_TEST_MODEL: '{{.MODEL | default "qwen2.5-coder-7b-instruct"}}'
      LLM_TEST_TOKEN: '{{.TOKEN}}'
    cmds:
      - go test -v ./internal/llm -run "TestIntegration_{{.TEST}}"

  itest:benchmark:
    desc: Run integration benchmarks
    internal: true
    env:
      RUN_LLM_INTEGRATION_TESTS: true
      LLM_TEST_ENDPOINT: '{{.ENDPOINT | default "http://192.168.86.20:1234"}}'
      LLM_TEST_MODEL: '{{.MODEL | default "qwen2.5-coder-7b-instruct"}}'
      LLM_TEST_TOKEN: '{{.TOKEN}}'
    cmds:
      - go test -bench=BenchmarkIntegration -v ./internal/llm

  itest:check-only:
    desc: Only check server connectivity
    internal: true
    cmds:
      - task: itest:check-server

  # Performance benchmarking tasks
  benchmark:
    desc: Run all performance benchmarks
    cmds:
      - task: benchmark:tools
      - task: benchmark:storage
      - task: benchmark:e2e
      - echo "🎉 All benchmarks completed! Check benchmark_results/ for detailed reports"

  benchmark:tools:
    desc: Run tool system performance benchmarks
    cmds:
      - mkdir -p benchmark_results
      - echo "🔧 Running tool system benchmarks..."
      - go test -run="^$" -bench=. -benchmem -count=3 ./internal/tools > benchmark_results/tools_latest.txt || echo "Some benchmarks may have failed - check results file"
      - echo "✅ Tool benchmarks completed"

  benchmark:storage:
    desc: Run storage system performance benchmarks
    cmds:
      - mkdir -p benchmark_results
      - echo "💾 Running storage system benchmarks..."
      - go test -run="^$" -bench=. -benchmem -count=3 ./internal/storage > benchmark_results/storage_latest.txt || echo "Some benchmarks may have failed - check results file"
      - echo "✅ Storage benchmarks completed"

  benchmark:e2e:
    desc: Run end-to-end performance benchmarks
    cmds:
      - mkdir -p benchmark_results
      - echo "🚀 Running E2E benchmarks..."
      - go test -bench=. -benchmem -count=3 ./test/e2e > benchmark_results/e2e_latest.txt 2>/dev/null || echo "No E2E benchmarks found"
      - echo "✅ E2E benchmarks completed"

  benchmark:profile:
    desc: Run benchmarks with CPU and memory profiling
    cmds:
      - mkdir -p benchmark_results
      - echo "🧠 Running performance profiling..."
      - go test -bench=BenchmarkToolExecution -cpuprofile=benchmark_results/tools_cpu_latest.prof ./internal/tools
      - go test -bench=BenchmarkStorageManager -memprofile=benchmark_results/storage_mem_latest.prof ./internal/storage
      - echo "✅ Profiling completed - use 'go tool pprof' to analyze"

  benchmark:concurrent:
    desc: Run concurrent performance benchmarks
    cmds:
      - mkdir -p benchmark_results
      - echo "⚡ Running concurrent performance tests..."
      - go test -bench="Concurrent" -benchmem -count=5 ./internal/tools ./internal/storage > benchmark_results/concurrent_latest.txt
      - echo "✅ Concurrent benchmarks completed"

  benchmark:memory:
    desc: Run memory usage benchmarks
    cmds:
      - mkdir -p benchmark_results
      - echo "🧠 Running memory usage benchmarks..."
      - go test -bench="Memory" -benchmem -count=3 ./internal/tools ./internal/storage > benchmark_results/memory_latest.txt
      - echo "✅ Memory benchmarks completed"

  benchmark:clean:
    desc: Clean benchmark results
    cmds:
      - rm -rf benchmark_results/
      - echo "🗑️ Benchmark results cleaned"